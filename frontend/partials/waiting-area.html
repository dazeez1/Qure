        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

        <div class="form-group">
          <label for="waiting-area-name">Name <span class="required">*</span></label>

            name="name"
            placeholder="e.g., Main Waiting Area"
            required
          />
        </div>

        <div class="form-group">
          <label for="waiting-area-capacity">Capacity <span class="required">*</span></label>
          <input
            type="number"
            id="waiting-area-capacity"
            name="capacity"
            placeholder="e.g., 50"
            min="1"
            required
          />
        </div>

        <div class="form-group">
          <label for="waiting-area-facility">Facility</label>
          <input
            type="text"
            id="waiting-area-facility"
            name="facility"
            placeholder="e.g., Main Building"
          />
        </div>

        <div class="form-group">
          <label for="waiting-area-floor">Floor</label>
          <input
            type="text"
            id="waiting-area-floor"
            name="floor"
            placeholder="e.g., Ground Floor"
          />
        </div>

        <div class="form-group checkbox-group">

            <input

              id="waiting-area-is-default"
              name="isDefault"
            />

          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="waiting-area-modal-cancel">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary">
          Create Waiting Area
        </button>
      </div>

</div>
