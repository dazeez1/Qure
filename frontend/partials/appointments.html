<div class="appointments-container">
  <!-- Header Section -->
  <div class="appointments-header">
    <div class="appointments-header-top">
      <h1 class="appointments-title">Appointments</h1>
    </div>
    
    <!-- Filters Row -->
    <div class="appointments-filters-row">
      <!-- Status Filter Buttons -->
      <div class="status-filters">
        <button class="status-filter-btn active" data-status="">All</button>
        <button class="status-filter-btn" data-status="BOOKED">Today</button>
        <button class="status-filter-btn" data-status="CHECKED_IN">Upcoming</button>
        <button class="status-filter-btn" data-status="COMPLETED">Past</button>
        <button class="status-filter-btn" data-status="CANCELLED">Cancelled</button>
      </div>

      <!-- Filter Controls -->
      <div class="appointments-filters">
        <!-- Date Range Filter -->
        <div class="filter-dropdown date-range-dropdown">
          <button class="filter-dropdown-btn" id="date-range-btn">
            <span class="material-symbols-outlined">calendar_today</span>
            Date Range
            <span class="material-symbols-outlined dropdown-arrow">keyboard_arrow_down</span>
          </button>
          <div class="date-range-panel" id="date-range-panel">
            <div class="date-range-content">
              <div class="date-input-group">
                <label>Start Date</label>
                <div class="date-input-wrapper">
                  <input type="date" class="date-input" id="start-date-input" placeholder="dd/mm/yyyy">
                </div>
              </div>
              <div class="date-input-group">
                <label>End Date</label>
                <div class="date-input-wrapper">
                  <input type="date" class="date-input" id="end-date-input" placeholder="dd/mm/yyyy">
                </div>
              </div>
              <div class="date-range-actions">
                <button class="btn btn-secondary" id="clear-date-btn">Clear</button>
                <button class="btn btn-primary" id="apply-date-btn">Apply</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Department Filter -->
        <div class="filter-dropdown department-dropdown">
          <select class="filter-select" id="department-filter">
            <option value="">All Departments</option>
          </select>
        </div>

        <!-- Search -->
        <div class="search-wrapper">
          <input type="text" class="search-input" id="appointments-search" placeholder="Search...">
          <button class="search-btn" id="search-btn" type="button">
            <span class="material-symbols-outlined">search</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="appointments-content">
    <!-- Table Section -->
    <div class="appointments-table-container">
      <table class="appointments-table">
        <thead>
          <tr>
            <th>Patient Name</th>
            <th>Doctor</th>
            <th>Department</th>
            <th>Type</th>
            <th>Date & Time</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="appointments-table-body">
          <!-- Appointments will be rendered here -->
        </tbody>
      </table>

      <!-- Pagination -->
      <div class="pagination-container" id="appointments-pagination">
        <!-- Pagination will be rendered here -->
      </div>
    </div>

    <!-- Appointment Details Sidebar -->
    <div class="appointment-details-sidebar" id="appointment-details-sidebar">
      <div class="appointment-details-content">
        <!-- Patient Info -->
        <div class="patient-info-section">
          <h2 class="patient-name" id="detail-patient-name">-</h2>
          <div class="patient-contact">
            <p class="patient-phone" id="detail-patient-phone">-</p>
            <p class="patient-mrn" id="detail-patient-mrn">-</p>
          </div>
        </div>

        <!-- Appointment Details -->
        <div class="appointment-details-section">
          <h3 class="section-title">Appointment Details</h3>
          <div class="detail-item">
            <span class="detail-label">Time:</span>
            <span class="detail-value" id="detail-time">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Department:</span>
            <span class="detail-value" id="detail-department">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Doctor:</span>
            <span class="detail-value" id="detail-doctor">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Notes:</span>
            <span class="detail-value" id="detail-notes">-</span>
          </div>
        </div>

        <!-- Notes Section -->
        <div class="notes-section">
          <h3 class="section-title">Notes</h3>
          <p class="notes-text" id="detail-notes-text">-</p>
        </div>

        <!-- Action Buttons -->
        <div class="appointment-actions">
          <button class="btn btn-secondary" id="no-show-btn">No Show</button>
          <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
          <div class="appointment-actions-row">
            <button class="btn btn-secondary" id="message-btn">Message</button>
            <button class="btn btn-primary" id="edit-btn">Edit</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
