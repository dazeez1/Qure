<div class="settings-security">
  <div class="security-card">
    <h2 class="section-title">Access Control</h2>

    <!-- Access Code Required Toggle -->
    <div class="form-group">
      <label class="toggle-label">
        <div class="toggle-container">
          <input type="checkbox" id="access-code-required" class="toggle-input" />
          <span class="toggle-slider"></span>
        </div>
        <div class="toggle-text">
          <span class="toggle-title">Require shared access code before entering the staff dashboard</span>
          <span class="toggle-helper" id="access-code-helper">
            When enabled, staff must enter the hospital access code before accessing the staff dashboard.
          </span>
        </div>
      </label>
    </div>

    <!-- Access Code Display Section -->
    <div class="access-code-section" id="access-code-section">
      <div class="access-code-display">
        <div class="access-code-label-group">
          <label class="access-code-label">Access Code:</label>
          <div class="access-code-value-container">
            <span class="access-code-value" id="access-code-value">••••••••</span>
            <button type="button" class="btn btn-reveal" id="reveal-btn">
              <span class="material-symbols-outlined" style="font-size: 1.2rem; margin-right: 0.4rem;">visibility</span>
              <span id="reveal-btn-text">Reveal</span>
            </button>
          </div>
        </div>
        <p class="access-code-warning">Do not share this code publicly.</p>
        <p class="access-code-timestamp" id="access-code-timestamp">Last updated: Just now</p>
      </div>

      <div class="regenerate-container">
        <button type="button" class="btn btn-secondary" id="regenerate-btn">
          <span class="material-symbols-outlined" style="font-size: 1.2rem; margin-right: 0.4rem;">refresh</span>
          Regenerate Code
        </button>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="security-actions">
    <button type="button" class="btn btn-secondary" id="cancel-security-btn">
      Cancel
    </button>
    <button type="button" class="btn btn-primary" id="save-security-btn" disabled>
      Save Changes
    </button>
  </div>
</div>

<!-- Regenerate Confirmation Modal -->
<div class="modal-overlay" id="regenerate-modal-overlay" style="display: none;">
  <div class="modal-container modal-container-small">
    <div class="modal-header">
      <h3 class="modal-title">Regenerate Access Code</h3>
      <button type="button" class="modal-close-btn" id="regenerate-modal-close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="modal-body">
      <p class="modal-message">
        Are you sure you want to regenerate the hospital access code?
      </p>
      <p class="modal-warning">
        All new staff will need to use the new code.<br>
        Previously shared codes will become invalid.
      </p>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="regenerate-modal-cancel">
        Cancel
      </button>
      <button type="button" class="btn btn-primary" id="regenerate-modal-confirm">
        <span class="material-symbols-outlined" style="font-size: 1.2rem; margin-right: 0.4rem;">refresh</span>
        Confirm Regenerate
      </button>
    </div>
  </div>
</div>
