<div class="queue-view">
  <div class="queue-header">
    <div class="header-title-group">
      <h1>Queue Control</h1>
      <div id="doctor-load-badge" class="load-badge hidden"></div>
    </div>
    <!-- Filters at the top -->
    <div class="queue-filters">
      <!-- Date Range Filter -->
      <div class="filter-dropdown date-range-dropdown">
        <button class="filter-dropdown-btn" id="queue-date-range-btn">
          <span class="material-symbols-outlined">calendar_today</span>
          Date Range
          <span class="material-symbols-outlined dropdown-arrow">keyboard_arrow_down</span>
        </button>
        <div class="date-range-panel" id="queue-date-range-panel">
          <div class="date-range-content">
            <div class="date-input-group">
              <label>Start Date</label>
              <div class="date-input-wrapper">
                <input type="date" class="date-input" id="queue-start-date-input" placeholder="dd/mm/yyyy">
              </div>
            </div>
            <div class="date-input-group">
              <label>End Date</label>
              <div class="date-input-wrapper">
                <input type="date" class="date-input" id="queue-end-date-input" placeholder="dd/mm/yyyy">
              </div>
            </div>
            <div class="date-range-actions">
              <button class="btn btn-secondary" id="queue-clear-date-btn">Clear</button>
              <button class="btn btn-primary" id="queue-apply-date-btn">Apply</button>
            </div>
          </div>
        </div>
      </div>
      <div class="filter-group search-group">
        <span class="material-symbols-outlined search-icon">search</span>
        <input
          type="text"
          id="queue-search-input"
          class="search-input"
          placeholder="Search name or ticket"
        />
      </div>
      <!-- Status Filter -->
      <div class="filter-dropdown">
        <button class="filter-dropdown-btn" id="queue-status-btn">
          <span class="material-symbols-outlined">filter_list</span>
          Status
          <span class="material-symbols-outlined dropdown-arrow">keyboard_arrow_down</span>
        </button>
        <div class="date-range-panel" id="queue-status-panel" style="min-width: 200px;">
          <div class="date-range-content">
            <div style="padding: 0.8rem 0;">
              <label style="display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 0; cursor: pointer; font-size: 1.2rem;">
                <input type="radio" name="queue-status" value="" id="status-all" checked style="width: 1.6rem; height: 1.6rem;">
                <span>All Active</span>
              </label>
              <label style="display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 0; cursor: pointer; font-size: 1.2rem;">
                <input type="radio" name="queue-status" value="WAITING" id="status-waiting" style="width: 1.6rem; height: 1.6rem;">
                <span>Waiting</span>
              </label>
              <label style="display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 0; cursor: pointer; font-size: 1.2rem;">
                <input type="radio" name="queue-status" value="TRIAGE" id="status-triage" style="width: 1.6rem; height: 1.6rem;">
                <span>Triage</span>
              </label>
              <label style="display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 0; cursor: pointer; font-size: 1.2rem;">
                <input type="radio" name="queue-status" value="CALLED" id="status-called" style="width: 1.6rem; height: 1.6rem;">
                <span>Called</span>
              </label>
              <label style="display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 0; cursor: pointer; font-size: 1.2rem;">
                <input type="radio" name="queue-status" value="IN_CONSULTATION" id="status-consultation" style="width: 1.6rem; height: 1.6rem;">
                <span>In Consultation</span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="queue-actions" id="queue-actions">
    <button class="btn btn-primary btn-call-next" id="call-next-btn">
      Call Next
    </button>
    <button class="btn btn-secondary" id="notify-btn" disabled>
      Notify selected patients
    </button>
    <button class="btn btn-secondary" id="reassign-btn" disabled>
      Reassign selected patients
    </button>
    <button class="btn btn-secondary" id="no-show-btn" disabled>
      Mark as No-show
    </button>
  </div>

  <!-- Loading Spinner -->
  <div id="loading-spinner" class="spinner hidden"></div>

  <!-- Main Content Area -->
  <div class="queue-content">
    <!-- Queue Table -->
    <div class="queue-table-container">
      <div class="queue-table-wrapper">
        <table class="queue-table" id="queue-table">
          <thead>
            <tr>
              <th>Select</th>
              <th>Patient Name</th>
              <th>Ticket #</th>
              <th>Status</th>
              <th>Wait Time</th>
              <th>Priority</th>
              <th>Assigned Room</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="queue-table-body">
            <tr>
              <td colspan="8" class="loading-message">Loading queue data...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Queue Summary -->
      <div class="queue-summary">
        <span id="queue-summary-text">Loading...</span>
        <div class="queue-pagination">
          <button class="pagination-btn" id="prev-page-btn" disabled>
            <span class="material-symbols-outlined">chevron_left</span>
          </button>
          <button class="pagination-btn" id="next-page-btn" disabled>
            <span class="material-symbols-outlined">chevron_right</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Right Sidebar - Patient Details -->
    <div class="queue-sidebar" id="queue-sidebar">
      <div class="sidebar-header-controls">
        <h3>Patient Details</h3>
        <button class="sidebar-close-btn" id="sidebar-close-btn">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="patient-details-card" id="patient-details-card">
        <div class="patient-details-placeholder">
          <p>Select a patient to view details</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Room Assignment Modal -->
<div class="modal-overlay" id="room-modal-overlay">
  <div class="modal-card room-modal">
    <div class="modal-header">
      <h2>Assign Room</h2>
      <button class="modal-close" id="room-modal-close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="modal-body">
      <p class="modal-description">Select a room for this consultation:</p>
      <div class="room-list" id="room-list">
        <div class="loading-message">Loading rooms...</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="room-modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="room-modal-confirm" disabled>Assign Room</button>
    </div>
  </div>
</div>
