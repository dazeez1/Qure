<div class="settings-staff-roles">
  <!-- Header with Invite Button -->
  <div class="staff-header">
    <button type="button" class="btn btn-primary" id="invite-staff-btn">
      <span class="material-symbols-outlined" style="font-size: 1.2rem; margin-right: 0.4rem;">person_add</span>
      Invite Staff
    </button>
  </div>

  <!-- Staff Table -->
  <div class="staff-table-container">
    <table class="staff-table" id="staff-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="staff-table-body">
        <!-- Table rows will be rendered here dynamically -->
      </tbody>
    </table>
  </div>
</div>

<!-- Invite Staff Modal -->
<div class="modal-overlay" id="invite-staff-modal" style="display: none;">
  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">Invite Staff</h3>
      <button type="button" class="modal-close-btn" id="close-invite-modal">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="invite-staff-form" class="modal-form">
      <div class="form-group">
        <label for="invite-first-name" class="form-label">First Name <span class="required">*</span></label>
        <input
          type="text"
          id="invite-first-name"
          name="firstName"
          class="form-input"
          placeholder="Enter first name"
          required
        />
        <span class="error-message" id="invite-first-name-error"></span>
      </div>

      <div class="form-group">
        <label for="invite-last-name" class="form-label">Last Name <span class="required">*</span></label>
        <input
          type="text"
          id="invite-last-name"
          name="lastName"
          class="form-input"
          placeholder="Enter last name"
          required
        />
        <span class="error-message" id="invite-last-name-error"></span>
      </div>

      <div class="form-group">
        <label for="invite-email" class="form-label">Email <span class="required">*</span></label>
        <input
          type="email"
          id="invite-email"
          name="email"
          class="form-input"
          placeholder="Enter email address"
          required
        />
        <span class="error-message" id="invite-email-error"></span>
      </div>

      <div class="form-group">
        <label for="invite-role" class="form-label">Staff Role <span class="required">*</span></label>
        <select id="invite-role" name="role" class="form-select" required>
          <option value="">Select role</option>
          <option value="DOCTOR">Doctor</option>
          <option value="NURSE">Nurse</option>
          <option value="ADMIN">Admin</option>
        </select>
        <span class="error-message" id="invite-role-error"></span>
      </div>

      <div class="form-group">
        <label for="invite-department" class="form-label">Department</label>
        <select id="invite-department" name="department" class="form-select">
          <option value="">Select department (optional)</option>
          <!-- Departments will be populated dynamically -->
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancel-invite-staff-btn">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" id="save-invite-staff-btn">
          Invite
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Staff Modal -->
<div class="modal-overlay" id="edit-staff-modal" style="display: none;">
  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">Edit Staff</h3>
      <button type="button" class="modal-close-btn" id="close-edit-staff-modal">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="edit-staff-form" class="modal-form">
      <input type="hidden" id="edit-staff-id" name="staffId" />
      
      <div class="form-group">
        <label for="edit-staff-name" class="form-label">Name</label>
        <input
          type="text"
          id="edit-staff-name"
          name="name"
          class="form-input"
          disabled
          style="background-color: #f3f4f6; cursor: not-allowed;"
        />
      </div>

      <div class="form-group">
        <label for="edit-staff-email" class="form-label">Email</label>
        <input
          type="email"
          id="edit-staff-email"
          name="email"
          class="form-input"
          disabled
          style="background-color: #f3f4f6; cursor: not-allowed;"
        />
      </div>

      <div class="form-group">
        <label for="edit-staff-role" class="form-label">Staff Role <span class="required">*</span></label>
        <select id="edit-staff-role" name="role" class="form-select" required>
          <option value="">Select role</option>
          <option value="DOCTOR">Doctor</option>
          <option value="NURSE">Nurse</option>
          <option value="ADMIN">Admin</option>
        </select>
        <span class="error-message" id="edit-staff-role-error"></span>
      </div>

      <div class="form-group">
        <label for="edit-staff-department" class="form-label">Department</label>
        <select id="edit-staff-department" name="department" class="form-select">
          <option value="">Select department (optional)</option>
          <!-- Departments will be populated dynamically -->
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Status</label>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="edit-staff-active" name="isActive" style="width: auto; cursor: pointer;" />
            <span style="font-size: 1.2rem;">Active</span>
          </label>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancel-edit-staff-btn">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" id="save-edit-staff-btn">
          Save
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Deactivate Staff Confirmation Modal -->
<div class="modal-overlay" id="delete-staff-modal" style="display: none;">
  <div class="modal-container modal-container-small">

    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="cancel-delete-staff-btn">
        Cancel
      </button>
      <button type="button" class="btn btn-danger" id="confirm-delete-staff-btn">
        Deactivate
      </button>
    </div>
  </div>
</div>
