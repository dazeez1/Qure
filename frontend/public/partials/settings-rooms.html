<div class="settings-rooms">
  <!-- Header with Add Button -->
  <div class="rooms-header">
    <button type="button" class="btn btn-primary" id="add-room-btn">
      Add New Room
    </button>
  </div>

  <!-- Rooms Table -->
  <div class="rooms-table-container">
    <table class="rooms-table" id="rooms-table">
      <thead>
        <tr>
          <th>Room Name</th>
          <th>Department</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rooms-table-body">
        <!-- Table rows will be rendered here dynamically -->
      </tbody>
    </table>
  </div>
</div>

<!-- Add Room Modal -->
<div class="modal-overlay" id="add-room-modal" style="display: none;">
  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">Add New Room</h3>
      <button type="button" class="modal-close-btn" id="close-add-modal">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="add-room-form" class="modal-form">
      <div class="form-group">
        <label for="add-room-name" class="form-label">Room Name <span class="required">*</span></label>
        <input
          type="text"
          id="add-room-name"
          name="roomName"
          class="form-input"
          placeholder="Enter room name (e.g., Room 101)"
          required
        />
        <span class="error-message" id="add-room-name-error"></span>
      </div>

      <div class="form-group">
        <label for="add-room-department" class="form-label">Department <span class="required">*</span></label>
        <select id="add-room-department" name="departmentId" class="form-select" required>
          <option value="">Select a department</option>
          <!-- Departments will be populated dynamically -->
        </select>
        <span class="error-message" id="add-room-department-error"></span>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancel-add-room-btn">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" id="save-add-room-btn">
          Save
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Room Modal -->
<div class="modal-overlay" id="edit-room-modal" style="display: none;">
  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">Edit Room</h3>
      <button type="button" class="modal-close-btn" id="close-edit-modal">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="edit-room-form" class="modal-form">
      <input type="hidden" id="edit-room-id" name="roomId" />
      
      <div class="form-group">
        <label for="edit-room-name" class="form-label">Room Name <span class="required">*</span></label>
        <input
          type="text"
          id="edit-room-name"
          name="roomName"
          class="form-input"
          placeholder="Enter room name (e.g., Room 101)"
          required
        />
        <span class="error-message" id="edit-room-name-error"></span>
      </div>

      <div class="form-group">
        <label for="edit-room-status" class="form-label">Status</label>
        <select id="edit-room-status" name="isActive" class="form-select">
          <option value="true">Active</option>
          <option value="false">Inactive</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancel-edit-room-btn">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" id="save-edit-room-btn">
          Save
        </button>
      </div>
    </form>
  </div>
</div>
