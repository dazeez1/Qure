<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles/variables.css" />
    <link rel="stylesheet" href="./src/styles/login.css" />
    <link rel="stylesheet" href="./src/styles/toast.css" />
    <title>Qure - Accept Invitation</title>
  </head>
  <body>
    <div class="form-wrapper">
      <div class="form-wrapper-inner">
        <div class="form-fill">
          <h2 class="acc-text login-title">Accept Invitation</h2>
          <p>Set your password to complete your account setup</p>

          <form id="accept-invite-form">
            <div class="input-group">
              <div class="password-wrapper">
                <input
                  type="password"
                  name="password"
                  id="accept-password"
                  placeholder="Password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  id="toggle-accept-password"
                  aria-label="Toggle password visibility"
                >
                  <span class="material-symbols-outlined">visibility_off</span>
                </button>
              </div>
              <span class="status" id="accept-password-error"></span>
            </div>

            <div class="input-group">
              <div class="password-wrapper">
                <input
                  type="password"
                  name="confirmPassword"
                  id="accept-confirm-password"
                  placeholder="Confirm Password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  id="toggle-accept-confirm-password"
                  aria-label="Toggle password visibility"
                >
                  <span class="material-symbols-outlined">visibility_off</span>
                </button>
              </div>
              <span class="status" id="accept-confirm-password-error"></span>
            </div>

            <div class="input-group">
              <button type="submit" id="accept-btn" class="login-btn login-btn-staff">
                Accept Invitation →
              </button>
            </div>
          </form>

          <div class="acct">
            <p>Already have an account? <a href="/login.html">Login</a></p>
          </div>
        </div>

        <div class="illustration-part">
          <div class="transparent-glass">
            <div class="logo">
              <img src="./public/images/Vector (2).png" alt="logo" />
              <p>Qure</p>
            </div>
            <h2 class="welcome-back">Welcome to Qure!</h2>
            <div class="laptop-illustration">
              <img src="./public/images/Device.png" alt="Laptop illustration" class="device-image" />
            </div>
          </div>
        </div>
      </div>

      <div class="copyright">
        <p>© 2025 Qure. All rights reserved.</p>
      </div>
    </div>

    <script type="module" src="./src/pages/auth/accept-invite.js"></script>
  </body>
</html>
